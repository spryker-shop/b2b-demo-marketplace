# Pellumbra 'full' data import for region EE (stores PL + UA).
#
# Generated by the project-starter wizard (project-data, generate strategy).
#
# EVERY source below lives under data/import/pellumbra/ - one tree, one source of truth:
#   stores/EE/    region store list + context
#   stores/PL|UA/ per-store definitions (locale/currency/country/context) plus the structural store
#                 relations (payment, shipment, shipment price, email CMS block assignment)
#   shared/       inherited reference + structural data this project imports (currency, tax, shipment,
#                 warehouse, templates, per-locale glossary, email CMS blocks, customers, B2B companies)
#   catalog/      the project's own themed catalog, incl. per-store price/stock/offer relations
#   cms/          the project's homepage content blocks, from the developer-supplied images
#   stripe/       project-local Stripe payment-method store assignment
#
# The shipped 463-product demo catalog and the demo store dirs are NOT referenced and no longer shadow
# the project's data. What remains under data/import/{common,b2b_common,robot,b2b_robot,production} is
# inherited demo material that nothing in this manifest imports.
#
# DEPENDENCY ORDER IS LOAD-BEARING - do not reorder. Base reference data (currency/locale/country)
# must precede its *-store relations; all store definitions must precede the catalog;
# merchants must precede offers; product-label precedes product-label-store.
version: 0

actions:
#1. Commerce Setup - stores, locales, currencies
  - data_entity: store
    source: data/import/pellumbra/stores/EE/store.csv
  - data_entity: configuration-value
    source: data/import/pellumbra/shared/configuration_value.csv
  - data_entity: currency
    source: data/import/pellumbra/shared/currency.csv
  - data_entity: currency-store
    source: data/import/pellumbra/stores/PL/currency_store.csv
  - data_entity: currency-store
    source: data/import/pellumbra/stores/UA/currency_store.csv
  - data_entity: country-store
    source: data/import/pellumbra/stores/PL/country_store.csv
  - data_entity: country-store
    source: data/import/pellumbra/stores/UA/country_store.csv
  - data_entity: locale-store
    source: data/import/pellumbra/stores/PL/locale_store.csv
  - data_entity: locale-store
    source: data/import/pellumbra/stores/UA/locale_store.csv
  - data_entity: default-locale-store
    source: data/import/pellumbra/stores/PL/default_locale_store.csv
  - data_entity: default-locale-store
    source: data/import/pellumbra/stores/UA/default_locale_store.csv
  - data_entity: context-store
    source: data/import/pellumbra/stores/PL/store_context.csv
  - data_entity: context-store
    source: data/import/pellumbra/stores/UA/store_context.csv

#2. Customers and glossary
  - data_entity: customer
    source: data/import/pellumbra/shared/customer.csv
  - data_entity: customer-group
    source: data/import/pellumbra/shared/customer_group.csv
  - data_entity: customer-group-to-customer
    source: data/import/pellumbra/shared/customer_group_to_customer.csv
  # One glossary file per locale (never one shared multi-locale file).
  # pl_PL and uk_UA are English copies for now - localize-content replaces them.
  - data_entity: glossary
    source: data/import/pellumbra/shared/glossary.en_US.csv
  - data_entity: glossary
    source: data/import/pellumbra/shared/glossary.pl_PL.csv
  - data_entity: glossary
    source: data/import/pellumbra/shared/glossary.uk_UA.csv

#3. Tax, shipment, stock, payment
  - data_entity: tax
    source: data/import/pellumbra/shared/tax.csv
  - data_entity: shipment
    source: data/import/pellumbra/shared/shipment.csv
  - data_entity: shipment-type
    source: data/import/pellumbra/shared/shipment_type.csv
  - data_entity: shipment-method-shipment-type
    source: data/import/pellumbra/shared/shipment_method_shipment_type.csv
  - data_entity: shipment-price
    source: data/import/pellumbra/stores/PL/shipment_price.csv
  - data_entity: shipment-price
    source: data/import/pellumbra/stores/UA/shipment_price.csv
  - data_entity: shipment-type-store
    source: data/import/pellumbra/stores/PL/shipment_type_store.csv
  - data_entity: shipment-type-store
    source: data/import/pellumbra/stores/UA/shipment_type_store.csv
  - data_entity: stock
    source: data/import/pellumbra/shared/warehouse.csv
  - data_entity: stock-address
    source: data/import/pellumbra/shared/warehouse_address.csv
  - data_entity: payment-method
    source: data/import/pellumbra/shared/payment_method.csv
  # Store relations
  - data_entity: shipment-method-store
    source: data/import/pellumbra/stores/PL/shipment_method_store.csv
  - data_entity: shipment-method-store
    source: data/import/pellumbra/stores/UA/shipment_method_store.csv
  - data_entity: stock-store
    source: data/import/pellumbra/catalog/PL/warehouse_store.csv
  - data_entity: stock-store
    source: data/import/pellumbra/catalog/UA/warehouse_store.csv
  - data_entity: payment-method-store
    source: data/import/pellumbra/stores/PL/payment_method_store.csv
  - data_entity: payment-method-store
    source: data/import/pellumbra/stores/UA/payment_method_store.csv
  - data_entity: return-reason

#4. Catalog - Pellumbra themed categories, attributes and products
  - data_entity: category-template
    source: data/import/pellumbra/shared/category_template.csv
  - data_entity: category
    source: data/import/pellumbra/catalog/category.csv
  - data_entity: category-store
    source: data/import/pellumbra/catalog/PL/category_store.csv
  - data_entity: category-store
    source: data/import/pellumbra/catalog/UA/category_store.csv
  - data_entity: product-attribute-key
    source: data/import/pellumbra/catalog/product_attribute_key.csv
  - data_entity: product-management-attribute
    source: data/import/pellumbra/catalog/product_management_attribute.csv
  - data_entity: product-abstract
    source: data/import/pellumbra/catalog/product_abstract.csv
  - data_entity: product-concrete
    source: data/import/pellumbra/catalog/product_concrete.csv
  - data_entity: product-image
    source: data/import/pellumbra/catalog/product_image.csv
  # REQUIRED for products to reach the search index: with a NULL approval_status the
  # page_product_abstract publisher writes no rows, so the catalog is silently unsearchable.
  - data_entity: product-approval-status
    source: data/import/pellumbra/catalog/product_abstract_approval_status.csv
  - data_entity: product-price
    source: data/import/pellumbra/catalog/PL/product_price.csv
  - data_entity: product-price
    source: data/import/pellumbra/catalog/UA/product_price.csv
  - data_entity: product-stock
    source: data/import/pellumbra/catalog/product_stock.csv
  # product-shipment-type has ~one row per concrete in the shipped demo (527 rows / 516 concretes), i.e. it
  # is NOT optional the way measurement/packaging units are (those are sparse, 10-20 rows). Every sellable
  # concrete needs a shipment type or shipment resolution has nothing to work with.
  - data_entity: product-shipment-type
    source: data/import/pellumbra/catalog/product_shipment_type.csv
  # Store relations
  - data_entity: product-abstract-store
    source: data/import/pellumbra/catalog/PL/product_abstract_store.csv
  - data_entity: product-abstract-store
    source: data/import/pellumbra/catalog/UA/product_abstract_store.csv

#5. Merchandising - labels and search facets
  # NEW and SALE only: both are wired to ProductLabelDependencyProvider updater plugins that have no
  # self-installer, so omitting them aborts the install. The other demo labels self-install or are demo-only.
  - data_entity: product-label
    source: data/import/pellumbra/shared/product_label.csv
  - data_entity: product-search-attribute-map
    source: data/import/pellumbra/catalog/product_search_attribute_map.csv
  - data_entity: product-search-attribute
    source: data/import/pellumbra/catalog/product_search_attribute.csv

#6. Content Management - templates and transactional email blocks only
  - data_entity: navigation
    source: data/import/pellumbra/shared/navigation.csv
  # navigation.csv only creates the CONTAINERS. Without navigation-node every menu renders EMPTY -
  # no top navigation, no footer links. navigation-node must follow navigation, and its category URLs
  # are the FULL nested per-locale paths Spryker generates from the translated category names.
  - data_entity: navigation-node
    source: data/import/pellumbra/shared/navigation_node.csv
  - data_entity: cms-template
    source: data/import/pellumbra/shared/cms_template.csv
  # cms_block.csv is filtered to the cms-block-email--* rows: these are the transactional email bodies
  # rendered by the Mail module, and dropping them throws on every registration/order/password mail.
  - data_entity: cms-block
    source: data/import/pellumbra/shared/cms_block.csv
  # Homepage carousel slides, built from the developer-supplied cms-images. Each banner is one slide of the
  # `slt-2` "Full Width Carousel" slot, which home.twig wraps in the slick-carousel molecule. Banners must
  # precede the block that renders them via content_banner().
  - data_entity: content-banner
    source: data/import/pellumbra/cms/content_banner.csv
  # THE TOP NAVIGATION AND FOOTER MENUS DEPEND ON THIS. page-layout-main.twig overrides the header's
  # `navigation` block with `{% cms_slot 'slt-desktop-header' %}`, so the menus are NOT rendered by a
  # navigation widget - they are CMS "Navigation block"s whose content calls content_navigation(<key>),
  # and that resolves a content-navigation item to a navigation container. Drop this file and every
  # menu renders as an empty <nav>.
  - data_entity: content-navigation
    source: data/import/pellumbra/cms/content_navigation.csv
  # Feeds the two homepage product sliders via content_product_abstract_list(<key>, 'slider').
  - data_entity: content-product-abstract-list
    source: data/import/pellumbra/cms/content_product_abstract_list.csv
  # Project homepage content block: a single Jumbotron block whose content emits the content_banner() calls,
  # exactly as the shipped demo wires blck-9. Do NOT put these in slt-3/slt-5 - those render stacked
  # full-width sections, not a carousel.
  - data_entity: cms-block
    source: data/import/pellumbra/cms/cms_block.csv
  - data_entity: cms-slot-template
    source: data/import/pellumbra/shared/cms_slot_template.csv
  - data_entity: cms-slot
    source: data/import/pellumbra/shared/cms_slot.csv
  # cms-slot-block wires blocks into slots, so it must follow BOTH cms-block and cms-slot.
  - data_entity: cms-slot-block
    source: data/import/pellumbra/cms/cms_slot_block.csv
  # Store relations
  - data_entity: cms-block-store
    source: data/import/pellumbra/stores/PL/cms_block_store.csv
  - data_entity: cms-block-store
    source: data/import/pellumbra/stores/UA/cms_block_store.csv
  - data_entity: cms-block-store
    source: data/import/pellumbra/cms/PL/cms_block_store.csv
  - data_entity: cms-block-store
    source: data/import/pellumbra/cms/UA/cms_block_store.csv

#7. B2B - companies, business units, roles
  - data_entity: company
    source: data/import/pellumbra/shared/company.csv
  - data_entity: company-business-unit
    source: data/import/pellumbra/shared/company_business_unit.csv
  - data_entity: company-unit-address
    source: data/import/pellumbra/shared/company_unit_address.csv
  - data_entity: company-unit-address-label
    source: data/import/pellumbra/shared/company_unit_address_label.csv
  - data_entity: company-unit-address-label-relation
    source: data/import/pellumbra/shared/company_unit_address_label_relation.csv
  - data_entity: company-user
    source: data/import/pellumbra/shared/company_user.csv
  - data_entity: company-business-unit-user
    source: data/import/pellumbra/shared/company_business_unit_user.csv
  - data_entity: company-business-unit-address
    source: data/import/pellumbra/shared/company_business_unit_address.csv
  - data_entity: company-role
    source: data/import/pellumbra/shared/company_role.csv
  - data_entity: company-role-permission
    source: data/import/pellumbra/shared/company_role_permission.csv
  - data_entity: company-user-role
    source: data/import/pellumbra/shared/company_user_role.csv
  - data_entity: company-user-on-behalf
    source: data/import/pellumbra/shared/company_user_on_behalf.csv

#8. Marketplace - merchants must precede their offers
  - data_entity: merchant
    source: data/import/pellumbra/catalog/merchant.csv
  - data_entity: merchant-store
    source: data/import/pellumbra/catalog/PL/merchant_store.csv
  - data_entity: merchant-store
    source: data/import/pellumbra/catalog/UA/merchant_store.csv
  - data_entity: merchant-user
    source: data/import/pellumbra/catalog/merchant_user.csv
  - data_entity: merchant-profile
    source: data/import/pellumbra/catalog/merchant_profile.csv
  - data_entity: merchant-stock
    source: data/import/pellumbra/catalog/merchant_stock.csv
  - data_entity: stock-store
    source: data/import/pellumbra/catalog/PL/marketplace/warehouse_store.csv
  - data_entity: stock-store
    source: data/import/pellumbra/catalog/UA/marketplace/warehouse_store.csv
  # merchant-product is the merchant<->abstract-product OWNERSHIP relation, distinct from the offer.
  # Without it the storefront shows no seller on the product page and the offer is not selectable.
  - data_entity: merchant-product
    source: data/import/pellumbra/catalog/merchant_product.csv
  - data_entity: merchant-product-offer
    source: data/import/pellumbra/catalog/merchant_product_offer.csv
  - data_entity: product-offer-stock
    source: data/import/pellumbra/catalog/product_offer_stock.csv
  - data_entity: product-offer-shipment-type
    source: data/import/pellumbra/catalog/product_offer_shipment_type.csv
  - data_entity: price-product-offer
    source: data/import/pellumbra/catalog/PL/price_product_offer.csv
  - data_entity: price-product-offer
    source: data/import/pellumbra/catalog/UA/price_product_offer.csv
  - data_entity: merchant-product-offer-store
    source: data/import/pellumbra/catalog/PL/merchant_product_offer_store.csv
  - data_entity: merchant-product-offer-store
    source: data/import/pellumbra/catalog/UA/merchant_product_offer_store.csv

#9. Miscellaneous
  - data_entity: mime-type
    source: data/import/pellumbra/shared/mime_type.csv
