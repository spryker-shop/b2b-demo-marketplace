# k6 load-test buyers — 1000 customers across 50 companies/BUs/roles.
# Additive import: run AFTER the standard b2b import. Source CSVs generated by
# ~/dev/k6-load-test/scripts/generate-test-fixtures.sh --count 1000 --companies 50
# and copied to data/import/k6/.
#
# Run: console data:import -c data/import/local/k6_buyers_EU.yml
# Entity order mirrors b2b_full_EU.yml (customer first, then company graph).
version: 0

actions:
  - data_entity: customer
    source: data/import/k6/customer.csv
  - data_entity: company
    source: data/import/k6/company.csv
  - data_entity: company-business-unit
    source: data/import/k6/company_business_unit.csv
  - data_entity: company-user
    source: data/import/k6/company_user.csv
  - data_entity: company-business-unit-user
    source: data/import/k6/company_business_unit_user.csv
  - data_entity: company-role
    source: data/import/k6/company_role.csv
  - data_entity: company-role-permission
    source: data/import/k6/company_role_permission.csv
  - data_entity: company-user-role
    source: data/import/k6/company_user_role.csv
