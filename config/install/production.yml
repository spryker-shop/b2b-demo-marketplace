env:
    NEW_RELIC_ENABLED: 0
    SPRYKER_CURRENT_REGION: EU

command-timeout: 1200

sections:
    clean-oms:
        clear-oms-locks:
            command: 'vendor/bin/console oms:clear-locks -vvv --no-ansi'

    diff:
        propel-migration-delete:
            command: 'vendor/bin/console propel:migration:delete -vvv --no-ansi'

        propel-diff:
            command: 'vendor/bin/console propel:diff -vvv --no-ansi'

        show_migrations:
            command: 'ls -al ./src/Orm/Propel/Migration_*/*.php 2>/dev/null || true'

        propel-migrate:
            command: 'vendor/bin/console propel:migrate -vvv --no-ansi'

        propel-migration-cleanup:
            command: 'vendor/bin/console propel:migration:delete -vvv --no-ansi'

    configuration:
        configuration-sync:
            command: 'vendor/bin/console configuration:sync -vvv --no-ansi'

    # Re-seeds config-derived DB records (OAuth clients, scopes, ACL, permissions) so that rotated
    # secrets injected into the containers stay in sync with their hashes in the database.
    # Without this a normal deploy leaves spy_oauth_client holding the previous secret hash and the
    # backend API /token endpoint fails with invalid_client until a destructive deploy reseeds it.
    init-db:
        setup-init-db:
            command: 'vendor/bin/console setup:init-db -vvv --no-ansi'

    scheduler-start:
        queue-setup:
            command: 'vendor/bin/console queue:setup'
        scheduler-setup:
            command: 'vendor/bin/console scheduler:setup -vvv --no-ansi'
    data-import:
        glossary:
            command: 'vendor/bin/console data:import:glossary -vvv --no-ansi'
        stripe:
            command: 'vendor/bin/console data:import --config=vendor/spryker-eco/stripe/data/import/stripe.yml -vvv --no-ansi'
    acl:
        acl-entity-synchronize:
            command: 'vendor/bin/console acl-entity:synchronize -vvv --no-ansi'
            stores: true

    api-router-cache-warmup:
        storefront:
            command: 'GLUE_APPLICATION=GLUE_STOREFRONT vendor/bin/glue cache:warmup'
        backend:
            command: 'GLUE_APPLICATION=GLUE_BACKEND vendor/bin/glue cache:warmup'
