env:
    NEW_RELIC_ENABLED: 0
    SPRYKER_CURRENT_REGION: EU

command-timeout: 7200

sections:
    configuration-export:
        configuration-export:
            # Off by default. An environment opts in with "-e configuration-restore" in its destructive
            # install hook; only there do Back Office values survive the deployment.
            excluded: true
            groups:
                - configuration-restore
            command: >-
                vendor/bin/console configuration:export
                integrations:google_analytics:tracking:measurement_id
                integrations:google_analytics:connection:property_id
                -vvv --no-ansi

    scheduler-clean:
        scheduler-clean:
            command: 'vendor/bin/console scheduler:clean -vvv --no-ansi'

    clean-storage:
        clean-storage:
            command: 'vendor/bin/console storage:delete -vvv --no-ansi'

        clean-db:
            command: 'vendor/bin/console propel:tables:drop -vvv --no-ansi'

    init-storages-per-region:
        propel-copy-schema:
            command: 'vendor/bin/console propel:schema:copy -vvv --no-ansi'

        propel-postgres-compatibility:
            command: 'vendor/bin/console propel:pg-sql-compat -vvv --no-ansi'

        propel-migration-delete:
            command: 'vendor/bin/console propel:migration:delete -vvv --no-ansi'

        propel-tables-drop:
            command: 'vendor/bin/console propel:tables:drop -vvv --no-ansi'

        propel-diff:
            command: 'vendor/bin/console propel:diff -vvv --no-ansi'

        propel-migrate:
            command: 'vendor/bin/console propel:migrate -vvv --no-ansi'

        propel-migration-cleanup:
            command: 'vendor/bin/console propel:migration:delete -vvv --no-ansi'

        init-database:
            command: 'vendor/bin/console setup:init-db -vvv --no-ansi'

    configuration:
        configuration-sync:
            command: 'vendor/bin/console configuration:sync -vvv --no-ansi'

        configuration-restore:
            excluded: true
            groups:
                - configuration-restore
            command: >-
                vendor/bin/console configuration:restore
                integrations:google_analytics:tracking:measurement_id
                integrations:google_analytics:connection:property_id
                -vvv --no-ansi

        configuration-import-environment:
            command: >-
                vendor/bin/console configuration:import-environment
                integrations:google_analytics:connection:service_account_credentials_json=SPRYKER_GOOGLE_ANALYTICS_SERVICE_ACCOUNT_JSON
                -vvv --no-ansi

    setup-queue:
        queue-setup:
            command: 'vendor/bin/console queue:setup'

    setup-minimal-data:
        import-demodata:
            command: 'vendor/bin/console data:import --config=data/import/local/store_${SPRYKER_CURRENT_REGION}.yml'

    clear-and-init-search:
        clean-search:
            command: 'vendor/bin/console elasticsearch:index:delete -vvv --no-ansi'
        setup-search-create-sources:
            command: 'vendor/bin/console search:setup:sources -vvv --no-ansi'

    demodata:
        import-demodata:
            command: 'vendor/bin/console data:import --config=data/import/local/full_${SPRYKER_CURRENT_REGION}.yml'

        update-product-labels:
            command: 'vendor/bin/console product-label:relations:update -vvv --no-ansi'

        check-product-validity:
            command: 'vendor/bin/console product:check-validity'

        stripe:
            command: 'vendor/bin/console data:import --config=vendor/spryker-eco/stripe/data/import/stripe.yml -vvv --no-ansi'

        punchout:
            command: 'vendor/bin/console punchout-gateway:demo-connection:create'

    scheduler-start:
        trigger-events:
            command: 'vendor/bin/console publish:trigger-events'
        scheduler-setup:
            command: 'vendor/bin/console scheduler:setup -vvv --no-ansi'
