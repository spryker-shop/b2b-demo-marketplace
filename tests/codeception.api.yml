namespace: PyzTest
actor: Tester

include:
    - PyzTest/*/*

paths:
    tests: .
    output: _output
    data: _data
    support: _support
    envs: _envs

settings:
    suite_class: \PHPUnit_Framework_TestSuite
    colors: true
    memory_limit: 1024M
    log: true

coverage:
    enabled: true
    remote: true
    c3_url: 'http://backoffice.de.shop-suite.local'
    whitelist: { include: ['src/Pyz/*.php'] }

extensions:
    enabled:
        - \SprykerTest\Shared\Testify\Helper\SuiteFilterHelper
    config:
        \SprykerTest\Shared\Testify\Helper\SuiteFilterHelper:
            inclusive:
                - Glue
                - EndToEnd
            # The BackendApiIntegration suites (@group BackendApi) don't carry @group
            # EndToEnd, so the inclusive filter above already excludes them - this is
            # only here to make that split explicit. They run via
            # tests/codeception.api.backend.yml instead, in a separate `codecept run`
            # process: their ApiPlatformHelper boots GLUE_BACKEND into the
            # process-global APPLICATION constant, which would collide with any other
            # suite booting a different application in the same run.
            exclusive:
                - BackendApi
