version: '0.1'

x-real-ip: &real-ip
  real-ip:
    from:
      - 10.0.0.0/8 # AWS VPC network
      - 103.21.244.0/22 # Cloudflare
      - 103.22.200.0/22 # Cloudflare
      - 103.31.4.0/22 # Cloudflare
      - 104.16.0.0/12 # Cloudflare
      - 108.162.192.0/18 # Cloudflare
      - 131.0.72.0/22 # Cloudflare
      - 141.101.64.0/18 # Cloudflare
      - 162.158.0.0/15 # Cloudflare
      - 172.64.0.0/13 # Cloudflare
      - 173.245.48.0/20 # Cloudflare
      - 188.114.96.0/20 # Cloudflare
      - 190.93.240.0/20 # Cloudflare
      - 197.234.240.0/22 # Cloudflare
      - 198.41.128.0/17 # Cloudflare
      - 2400:cb00::/32 # Cloudflare
      - 2606:4700::/32 # Cloudflare
      - 2803:f800::/32 # Cloudflare
      - 2405:b500::/32 # Cloudflare
      - 2405:8100::/32 # Cloudflare
      - 2c0f:f248::/32 # Cloudflare
      - 2a06:98c0::/29 # Cloudflare

x-frontend-auth: &frontend-auth
  <<: *real-ip
  auth:
    engine: basic
    users:
      - username: cloud
        password: cloud
    exclude:
      - '${ALLOWED_IP}' # AWS gateway
      - 185.60.20.0/24 # PayOne

namespace: sa-internal-ptest
tag: '1.0'

environment: docker.production
image:
  tag: spryker/php:8.4
  environment:
    SPRYKER_HOOK_BEFORE_DEPLOY: 'vendor/bin/install -r EU/pre-deploy.multi-db -vvv'
    SPRYKER_HOOK_AFTER_DEPLOY: 'true'
    SPRYKER_HOOK_INSTALL: 'vendor/bin/install -r EU/production.multi-db --no-ansi -vvv'
    SPRYKER_HOOK_DESTRUCTIVE_INSTALL: 'vendor/bin/install -r EU/destructive.multi-db --no-ansi -vvv'
    SPRYKER_DEBUG_ENABLED: false
    SPRYKER_YVES_HOST_DE: yves.de.ptest.cloud.spryker.toys
    SPRYKER_YVES_HOST_AT: yves.at.ptest.cloud.spryker.toys
    SPRYKER_YVES_HOST_FR: yves.fr.ptest.cloud.spryker.toys
    AWS_REGION: "eu-west-1"
  node:
    version: 24
    npm: 10
  php:
    ini:
        max_execution_time: 60
    enabled-extensions:
        - otel
        - amqp

composer:
  mode: --no-dev
  autoload: --classmap-authoritative

assets:
  image: spryker/nginx-brotli:latest
  mode: production
  compression:
    brotli:
      static: on
      level: 5

regions:
  EU:
    services:
      mail:
        sender:
          name: Spryker No-Reply
          email: no-reply@ptest.cloud.spryker.toys
      # Multi-DB: one logical database per store on the same RDS instance.
      # No region-level "database" block: with one, the platform provisions only the default DB.
      # Name each database like its store: the platform keys SPRYKER_PAAS_SERVICES by the
      # upper-cased database name, and the app looks it up by APPLICATION_STORE.
      databases:
        de:
        at:
        fr:
    stores:
      DE:
        services:
          broker:
            namespace: de-docker
          key_value_store:
            namespace: 1
          search:
            namespace: de_search
          database:
            name: de
      AT:
        services:
          broker:
            namespace: at-docker
          key_value_store:
            namespace: 2
          search:
            namespace: at_search
          database:
            name: at
      FR:
        services:
          broker:
            namespace: fr-docker
          key_value_store:
            namespace: 3
          search:
            namespace: fr_search
          database:
            name: fr

groups:
  EU:
    region: EU
    applications:
      mportal:
        application: merchant-portal
        endpoints:
          mp.de.ptest.cloud.spryker.toys:
            store: DE
            <<: *frontend-auth
            entry-point: MerchantPortal
            primal: true
            services:
              session:
                namespace: 7
          mp.at.ptest.cloud.spryker.toys:
            store: AT
            <<: *frontend-auth
            entry-point: MerchantPortal
            services:
              session:
                namespace: 8
          mp.fr.ptest.cloud.spryker.toys:
            store: FR
            <<: *frontend-auth
            entry-point: MerchantPortal
            services:
              session:
                namespace: 9
      yves:
        application: yves
        endpoints:
          yves.de.ptest.cloud.spryker.toys:
            store: DE
            <<: *frontend-auth
            services:
              session:
                namespace: 1
          yves.at.ptest.cloud.spryker.toys:
            store: AT
            <<: *frontend-auth
            services:
              session:
                namespace: 2
          yves.fr.ptest.cloud.spryker.toys:
            store: FR
            <<: *frontend-auth
            services:
              session:
                namespace: 5
      glue:
        application: glue
        endpoints:
          glue.de.ptest.cloud.spryker.toys:
            store: DE
          glue.at.ptest.cloud.spryker.toys:
            store: AT
          glue.fr.ptest.cloud.spryker.toys:
            store: FR
      boffice:
        application: backoffice
        endpoints:
          backoffice.de.ptest.cloud.spryker.toys:
            store: DE
            <<: *frontend-auth
            primal: true
            services:
              session:
                namespace: 3
          backoffice.at.ptest.cloud.spryker.toys:
            store: AT
            <<: *frontend-auth
            services:
              session:
                namespace: 4
          backoffice.fr.ptest.cloud.spryker.toys:
            store: FR
            <<: *frontend-auth
            services:
              session:
                namespace: 6
      backgw:
        application: backend-gateway
        endpoints:
          backend-gateway.de.ptest.cloud.spryker.toys:
            store: DE
            primal: true
          backend-gateway.at.ptest.cloud.spryker.toys:
            store: AT
            primal: true
          backend-gateway.fr.ptest.cloud.spryker.toys:
            store: FR
            primal: true
      gluebackend:
        application: glue-backend
        endpoints:
          glue-backend.de.ptest.cloud.spryker.toys:
            store: DE
          glue-backend.at.ptest.cloud.spryker.toys:
            store: AT
          glue-backend.fr.ptest.cloud.spryker.toys:
            store: FR

services:
  database:
    engine: mysql
    version: mariadb-10.4
    root:
      username: 'root'
      password: secret
    endpoints:
      localhost:3306:
        protocol: tcp
  broker:
    engine: rabbitmq
    version: '3.9'
    api:
      username: 'spryker'
      password: secret
    endpoints:
      queue.ptest.cloud.spryker.toys:
      localhost:5672:
        protocol: tcp
  session:
    engine: redis
  key_value_store:
    engine: redis
    endpoints:
      localhost:16379:
        protocol: tcp
  search:
    engine: elastic
    version: '7.10'
    endpoints:
      localhost:9200:
        protocol: tcp
  scheduler:
    engine: jenkins
    version: '2.442'
    endpoints:
      scheduler.ptest.cloud.spryker.toys:
  mail_catcher:
    engine: mailhog
    endpoints:
      mail.ptest.cloud.spryker.toys:
  swagger:
    engine: swagger-ui
    endpoints:
      swagger.ptest.cloud.spryker.toys:
  redis-gui:
    engine: redis-commander
    endpoints:
      redis-commander.ptest.cloud.spryker.toys:
  dashboard:
    engine: dashboard
    endpoints:
      ptest.cloud.spryker.toys:
docker:
  blackfire:
    enabled: false
  ssl:
    enabled: true
    redirect: true
  debug:
    enabled: false
    xdebug:
      enabled: false
  mount:
    baked: