name: _codeception

on:
    workflow_call:
        inputs:
            platform-image:
                description: "PHP platform image both jobs boot on."
                type: string
                default: "spryker/php:8.4"
            acceptance-deploy-file:
                description: "Deploy file the acceptance & API job boots."
                type: string
                default: ".github/deploy/deploy.ci.acceptance.mariadb.yml"
            functional-deploy-file:
                description: "Deploy file the functional job boots."
                type: string
                default: ".github/deploy/deploy.ci.functional.mariadb.yml"
            restore-db:
                # Both the dump and the sync check speak the MariaDB client, so a
                # PostgreSQL caller turns this off and imports demodata instead.
                description: "Restore the shared spryker-app-db dump instead of importing demodata."
                type: boolean
                default: true

env:
    SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    WEEKLY_CI_SLACK_CHANNEL_ID: ${{ secrets.WEEKLY_CI_SLACK_CHANNEL_ID }}
    JIRA_TICKET_SLACK_USER_GROUP_MAPPING: ${{ secrets.JIRA_TICKET_SLACK_USER_GROUP_MAPPING }}

jobs:
    # [remove for project] product-delivery acceptance + API suite.
    acceptance-api:
        name: "Codeception / Acceptance & API"
        runs-on: ubuntu-latest
        env:
            PROGRESS_TYPE: plain
            SPRYKER_PLATFORM_IMAGE: ${{ inputs.platform-image }}
            TRAVIS: 1
            SPRYKER_CURRENT_REGION: EU
            DYNAMIC_STORE_MODE: true
            DEPLOY_FILE: ${{ inputs.acceptance-deploy-file }}
            RESTORE_DB: ${{ inputs.restore-db }}

        steps:
            -   uses: actions/checkout@v4
                with:
                    # Nothing downstream needs the checkout token; every repo cloned or
                    # composer-installed in these jobs is public.
                    persist-credentials: false

            -   uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
                with:
                    composer-options: "-q --ignore-platform-reqs --optimize-autoloader --no-interaction --prefer-install=auto"

            -   name: Configure sysctl limits
                run: |
                    sudo sysctl -w vm.swappiness=10
                    sudo sysctl -w fs.file-max=262144
                    sudo sysctl -w vm.max_map_count=262144
                    ulimit -n 65536

            # Must land before the boot so the dump is part of the baked image.
            -   uses: actions/download-artifact@v6
                if: ${{ inputs.restore-db }}
                with:
                    name: spryker-app-db

            -   name: Run docker
                # The pipeline override restores the shared dump instead of importing demodata;
                # the deploy file's own pipeline key is untouched.
                run: |
                    git clone https://github.com/spryker/docker-sdk.git ./docker && git -C ./docker fetch --depth 1 origin $(cat .git.docker) && git -C ./docker checkout $(cat .git.docker)
                    docker/sdk boot "$DEPLOY_FILE"
                    if [ "$RESTORE_DB" = "true" ]; then
                        SPRYKER_PIPELINE=ci.restore-db.stage2 docker/sdk up -t
                    else
                        docker/sdk up -t
                    fi

            -   name: Validate sync completeness
                if: ${{ inputs.restore-db }}
                uses: ./.github/actions/validate-sync-completeness

            -   name: Run Fixtures
                run: |
                    docker/sdk testing codecept fixtures
                    docker/sdk testing composer dump-autoload -o -a --apcu -q
                    echo "console queue:worker:start --stop-when-empty"
                    docker/sdk testing console queue:worker:start --stop-when-empty

            -   name: Run Acceptance Tests
                id: acceptance-tests
                run: |
                    docker/sdk testing codecept run -c tests/codeception.acceptance.yml

            -   name: Run API Tests
                id: api-tests
                run: |
                    docker/sdk testing codecept run -c tests/codeception.api.yml

            -   name: Save PHP logs
                if: always() && (steps.api-tests.outcome == 'failure' || steps.acceptance-tests.outcome == 'failure')
                run: |
                    mkdir -p logs
                    docker logs spryker_ci_backoffice_eu_1 > logs/backoffice_app.log 2>&1
                    docker logs spryker_ci_glue_eu_1 > logs/glue_app.log 2>&1
                    docker logs spryker_ci_yves_eu_1 > logs/yves_app.log 2>&1
                    docker logs spryker_ci_merchant_portal_eu_1 > logs/merchant_portal_app.log 2>&1
                    echo "PHP logs saved. After upload, they will be available in GitHub Actions Artifacts as 'codeception-failed-artifacts'"

            -   name: Upload logs, failed screenshots and HTML
                if: always() && (steps.api-tests.outcome == 'failure' || steps.acceptance-tests.outcome == 'failure')
                uses: actions/upload-artifact@v5
                with:
                    name: codeception-failed-artifacts
                    retention-days: 5 # save for 5 days
                    path: |
                        logs/*.log
                        tests/**/_output/**/*
                        src/Spryker/**/tests/_output/*

            -   name: Slack Notification for failed job
                uses: ./.github/actions/job-slack-notifications
                if: always()

    # [project applicable] Functional Codeception tests.
    functional:
        name: "Codeception / Functional Tests"
        runs-on: ubuntu-latest
        env:
            PROGRESS_TYPE: plain
            SPRYKER_PLATFORM_IMAGE: ${{ inputs.platform-image }}
            TRAVIS: 1
            SPRYKER_CURRENT_REGION: EU
            DYNAMIC_STORE_MODE: true
            COMPOSER_IGNORE_CHROMEDRIVER: 1
            DEPLOY_FILE: ${{ inputs.functional-deploy-file }}
            RESTORE_DB: ${{ inputs.restore-db }}

        steps:
            -   uses: actions/checkout@v4
                with:
                    persist-credentials: false

            -   uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
                with:
                    composer-options: "-q --ignore-platform-reqs --optimize-autoloader --no-interaction --prefer-install=auto"

            # Must land before the boot so the dump is part of the baked image.
            -   uses: actions/download-artifact@v6
                if: ${{ inputs.restore-db }}
                with:
                    name: spryker-app-db

            -   name: Run docker
                # The pipeline override restores the shared dump instead of importing demodata;
                # the deploy file's own pipeline key is untouched.
                run: |
                    git clone https://github.com/spryker/docker-sdk.git ./docker && git -C ./docker fetch --depth 1 origin $(cat .git.docker) && git -C ./docker checkout $(cat .git.docker)
                    docker/sdk boot "$DEPLOY_FILE" -a --apcu
                    if [ "$RESTORE_DB" = "true" ]; then
                        SPRYKER_PIPELINE=ci.restore-db.stage2 docker/sdk up -t
                    else
                        docker/sdk up -t
                    fi
                    docker/sdk cli composer dump-autoload -o -a --apcu -q

            -   name: Validate sync completeness
                if: ${{ inputs.restore-db }}
                uses: ./.github/actions/validate-sync-completeness

            -   name: Run Tests
                run: docker/sdk testing codecept run -c tests/codeception.ci.functional.yml

            # [optional for project]
            -   name: Slack Notification for failed job
                uses: ./.github/actions/job-slack-notifications
                if: always()
