name: B2B-MP-CI

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    cypress-css-delivery-debug:
        name: "Cypress / CSS delivery debug"
        runs-on: ubuntu-latest
        env:
            PROGRESS_TYPE: plain
            SPRYKER_PLATFORM_IMAGE: spryker/php:8.4
            TRAVIS: 1
            SPRYKER_CURRENT_REGION: EU
            DYNAMIC_STORE_MODE: true
        steps:
            -   uses: actions/checkout@v4

            -   uses: ramsey/composer-install@v3
                with:
                    composer-options: "-q --ignore-platform-reqs --optimize-autoloader --no-interaction --prefer-install=auto"

            -   name: Configure sysctl limits
                run: |
                    sudo sysctl -w vm.swappiness=10
                    sudo sysctl -w fs.file-max=262144
                    sudo sysctl -w vm.max_map_count=262144
                    ulimit -n 65536

            -   name: Run project in Docker
                run: |
                    git clone https://github.com/spryker/docker-sdk.git ./docker && git -C ./docker fetch --depth 1 origin $(cat .git.docker) && git -C ./docker checkout $(cat .git.docker)
                    docker/sdk boot .github/deploy/deploy.ci.acceptance.mariadb.cypress.yml
                    sudo bash -c "echo '127.0.0.1 backend-api.eu.spryker.local backend-api.us.spryker.local backend-gateway.eu.spryker.local backend-gateway.us.spryker.local backoffice.eu.spryker.local backoffice.us.spryker.local glue-backend.eu.spryker.local glue-backend.us.spryker.local glue-storefront.eu.spryker.local glue-storefront.us.spryker.local glue.eu.spryker.local glue.us.spryker.local mail.spryker.local mp.eu.spryker.local mp.us.spryker.local queue.spryker.local spryker.local swagger.spryker.local yves.eu.spryker.local yves.us.spryker.local' >> /etc/hosts"
                    docker/sdk up -t
                    docker/sdk cli composer dump-autoload -o -a --apcu -q

            -   name: Debug CSS delivery (node fetch from cypress container)
                run: |
                    cat > tests/cypress-tests/cypress/support/__delivery-probe.cjs <<'EOF'
                    const urls = {
                        'non-critical': 'http://yves.eu.spryker.local/assets/current/default/css/yves_default.non-critical.css',
                        'critical': 'http://yves.eu.spryker.local/assets/current/default/css/yves_default.critical.css',
                    };
                    const base = 'http://yves.eu.spryker.local';
                    const jar = new Map();
                    const cookieHeader = () => [...jar.values()].join('; ');
                    const storeCookies = (res) => {
                        const cookies = res.headers.getSetCookie ? res.headers.getSetCookie() : [];
                        for (const c of cookies) {
                            const kv = c.split(';')[0];
                            jar.set(kv.split('=')[0], kv);
                        }
                    };
                    const get = async (path) => {
                        let url = base + path;
                        for (let hop = 0; hop < 6; hop++) {
                            const res = await fetch(url, {redirect: 'manual', headers: {cookie: cookieHeader()}});
                            storeCookies(res);
                            if (res.status >= 300 && res.status < 400) {
                                const loc = res.headers.get('location');
                                url = loc.startsWith('http') ? loc : base + loc;
                                continue;
                            }
                            return {res, html: await res.text(), url};
                        }
                        throw new Error('redirect loop');
                    };
                    (async () => {
                        for (const [name, url] of Object.entries(urls)) {
                            const start = Date.now();
                            const res = await fetch(url);
                            const body = await res.text();
                            console.log(`${name}: status=${res.status} bytes=${body.length} time=${Date.now() - start}ms is-hidden=${(body.match(/is-hidden/g) || []).length}`);
                        }
                    })().catch(e => console.log('PROBE FAILED:', e.message));
                    EOF
                    docker/sdk exec cypress-tests node cypress/support/__delivery-probe.cjs
                    docker/sdk cli composer show 2>/dev/null | grep -E "spryker-shop/shop-ui|spryker-shop/customer-page|self-service-portal|purchasing-control" || true

            -   name: Debug CSS on disk (yves container)
                run: |
                    docker/sdk exec yves_eu sh -c 'ls -la /data/public/Yves/assets/current/default/css/ 2>/dev/null; md5sum /data/public/Yves/assets/current/default/css/yves_default.non-critical.css 2>/dev/null' || true

            -   name: Run markup probe spec in real browser
                id: run_tests
                run: |
                    cat > tests/cypress-tests/cypress/e2e/__markup-probe.cy.ts <<'EOF'
                    describe('order filter section markup probe', (): void => {
                      it('dumps section class and computed display', (): void => {
                        cy.visit('/login');
                        cy.get('input[name="loginForm[email]"]').type('sonia@acme.com');
                        cy.get('input[name="loginForm[password]"]').type('change123');
                        cy.get('form[name="loginForm"]').submit();
                        cy.url().should('not.include', '/login');
                        cy.visit('/customer/order');
                        cy.get('form[name="orderSearchForm"]').should('exist');
                        cy.document().then((doc) => {
                          const section = doc.querySelector('[class*="filter-section"]') as HTMLElement | null;
                          const out = {
                            url: doc.location.href,
                            sectionClass: section ? section.className : 'NOT FOUND',
                            sectionDisplay: section ? doc.defaultView.getComputedStyle(section).display : null,
                            activeFiltersRendered: !!doc.querySelector('[class*="order-active-filters"]'),
                            sectionHtmlHead: section ? section.outerHTML.slice(0, 1000) : null,
                            styleSheets: Array.from(doc.styleSheets).map((s) => {
                              let n = -1;
                              try { n = s.cssRules.length; } catch (e) { n = -2; }
                              return `${(s.href || 'inline').split('/').pop()}:${n}`;
                            }),
                          };
                          cy.writeFile('cypress/support/__probe-out.json', out);
                        });
                      });
                    });
                    EOF
                    docker/sdk exec cypress-tests cp .env.dynamic-store.example .env
                    docker/sdk exec cypress-tests git log -1
                    docker/sdk exec cypress-tests npx cypress install
                    docker/sdk exec --env "ENV_REPOSITORY_ID=b2b-mp" --env "ENV_IS_SSP_ENABLED=true" cypress-tests npx cypress run --spec cypress/e2e/__markup-probe.cy.ts --headless --browser chrome || true
                    echo "=== PROBE OUTPUT ==="
                    cat tests/cypress-tests/cypress/support/__probe-out.json || echo "NO PROBE OUTPUT"

            -   name: Collect evidence
                if: always()
                run: |
                    mkdir -p evidence
                    echo "--- .cypress dirs on runner ---"
                    sudo find . -type d -name ".cypress" 2>/dev/null || true
                    echo "--- mp4/png files ---"
                    sudo find . \( -name "*.mp4" -o -path "*cypress/screenshots/*.png" \) 2>/dev/null | head -20 || true
                    for d in $(sudo find . -type d -name ".cypress" 2>/dev/null); do sudo cp -R "$d"/. evidence/ 2>/dev/null || true; done
                    sudo find . -name "*.mp4" -not -path "./evidence/*" -exec cp {} evidence/ \; 2>/dev/null || true
                    sudo chmod -R a+r evidence || true
                    ls -laR evidence | head -40

            -   name: Upload evidence
                if: always()
                uses: actions/upload-artifact@v5
                with:
                    name: css-delivery-debug
                    retention-days: 5
                    path: evidence/
                    include-hidden-files: true
