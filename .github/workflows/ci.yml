name: Pellumbra-CI

# Project CI for pellumbra/shop.
#
# Derived from the shipped b2b-demo-marketplace `B2B-MP-CI` workflow by keeping only the jobs
# the maintainers marked `[project applicable]`. Every command below is the original verbatim.
#
# Removed as product-delivery only (they existed to protect the upstream release, not this
# project): the acceptance, robot-api, robot-ui and cypress suites, the cross-version /
# cross-database `compatibility-ci` workflow, product API-doc publishing, and the
# release-branch upmerge automation.
#
# Trims applied: single PHP version (the multi-PHP matrix was product-only), no release-branch
# evaluator step (this project has no release-* branches), no Slack notification steps.
#
# Region/store tokens are this project's own: region EE, stores PL + UA. The demoshop CI used
# region EU / store DE, which do not exist here (see src/SprykerConfig/CodeBucketConfig.php).

on:
    pull_request:
    push:
        branches:
            - master
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    scan-credentials:
        name: "Scan for Credentials"
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run TruffleHog OSS
              uses: trufflesecurity/trufflehog@v3.90.8
              with:
                  extra_args: --log-level=2 --results=verified

    validation:
        name: "Static analysis"
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        runs-on: ubuntu-latest

        env:
            APPLICATION_ENV: ci.mysql
            APPLICATION_STORE: PL
            PROJECT: suite
            SPRYKER_CURRENT_REGION: EE
            # This project is DMS: stores live in the database, not in config/Shared/stores.php.
            # Without this flag the deprecated legacy Store bootstraps (Environment::defineLocale)
            # and requires a `PL` key in the still-shipped config/Shared/stores.php, whose hardcoded
            # fallback only defines DE/AT/US -> "Missing setup for store: PL" on the first console
            # call. Docker supplies SPRYKER_ACTIVE_STORES from the deploy file, but this job runs
            # console on the bare runner, so the flag has to be set here.
            SPRYKER_DYNAMIC_STORE_MODE: true
            COMPOSER_IGNORE_CHROMEDRIVER: 1

        steps:
            -   uses: actions/checkout@v4

            -   uses: ramsey/composer-install@v3
                with:
                    composer-options: "-q --ignore-platform-reqs --no-interaction --prefer-install=auto"

            -   name: Generate transfer objects
                run: vendor/bin/console transfer:generate

            -   name: Generate transfer databuilder objects
                run: vendor/bin/console transfer:databuilder:generate

            -   name: Propel install
                run: |
                    vendor/bin/console propel:schema:copy
                    vendor/bin/console propel:model:build
                    vendor/bin/console transfer:entity:generate

            -   name: Codecept build
                run: vendor/bin/codecept build -q

            -   name: Generate autocompletion files
                run: vendor/bin/console dev:ide-auto-completion:generate

            -   name: Setup search map files
                run: vendor/bin/console search:setup:source-map

            -   name: Validate propel files
                run: |
                    vendor/bin/console propel:schema:validate
                    vendor/bin/console propel:schema:validate-xml-names

            -   name: Validate transfer files
                run: vendor/bin/console transfer:validate

            -   name: Run CodeStyle checks
                run: vendor/bin/console code:sniff:style

            -   name: Run Architecture rules
                run: vendor/bin/phpmd src/ text vendor/spryker/architecture-sniffer/src/ruleset.xml --minimumpriority 2

            -   name: Run Project Architecture rules
                run: vendor/bin/phpmd src/ text phpmd.xml --minimumpriority 4

            -   name: Generate rest API documentation
                run: vendor/bin/console rest-api:generate:documentation

            -  name: Generate API
               run: |
                   echo "vendor/bin/glue api:generate" && vendor/bin/glue api:generate --quiet-meta --keep-existing
                   echo "GLUE_APPLICATION=GLUE_BACKEND vendor/bin/glue api:generate" && GLUE_APPLICATION=GLUE_BACKEND vendor/bin/glue api:generate --quiet-meta --keep-existing

            -   name: Run PHPStan
                run: vendor/bin/phpstan analyze -l 6 -c phpstan.neon src/

            -   name: Run Evaluator for all branches
                run: vendor/bin/evaluator evaluate --exclude-checkers=SPRYKER_DEV_PACKAGES_CHECKER --format=compact

            -   uses: actions/setup-node@v4
                with:
                    node-version: '24'

            -   name: Install NPM packages
                run: |
                    sudo npm i --location=global --unsafe-perm speccy@0.11.0

            -   name: Speccy lint Glue specification
                run: speccy lint src/Generated/Glue/Specification/spryker_rest_api.schema.yml --rules=default --skip openapi-tags

    js-validation:
        name: "NPM validation"
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v5
                with:
                    node-version: '24'
                    cache: 'npm'

            -   name: Install NPM packages
                run: npm ci

            -   name: Style lint
                run: npm run yves:stylelint

            -   name: ES lint
                run: npm run yves:lint

            -   name: Front-end Formatter
                run: npm run formatter

            -   name: Front-end MP Lint
                run: npm run mp:lint

            -   name: Front-end MP Style lint
                run: npm run mp:stylelint

            -   name: Front-end MP Unit Tests
                run: npm run mp:test

    php-84-mariadb-functional-alpine:
        needs: [validation, js-validation]
        name: "Codeception / Functional Tests"
        runs-on: ubuntu-latest
        env:
            PROGRESS_TYPE: plain
            SPRYKER_PLATFORM_IMAGE: spryker/php:8.4
            TRAVIS: 1
            SPRYKER_CURRENT_REGION: EE
            DYNAMIC_STORE_MODE: true
            COMPOSER_IGNORE_CHROMEDRIVER: 1

        steps:
            -   uses: actions/checkout@v4

            -   uses: ramsey/composer-install@v3
                with:
                    composer-options: "-q --ignore-platform-reqs --optimize-autoloader --no-interaction --prefer-install=auto"

            -   name: Run docker
                run: |
                    git clone https://github.com/spryker/docker-sdk.git ./docker && git -C ./docker fetch --depth 1 origin $(cat .git.docker) && git -C ./docker checkout $(cat .git.docker)
                    docker/sdk boot .github/deploy/deploy.ci.functional.mariadb.yml -a --apcu
                    docker/sdk up -t

            -   name: Run Tests
                run: docker/sdk testing codecept run -c tests/codeception.ci.functional.yml
