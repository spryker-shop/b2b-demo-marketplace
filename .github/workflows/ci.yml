name: B2B-MP-CI

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    push:
        branches:
            - master
    workflow_dispatch:

# [optional for project]
env:
    SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    WEEKLY_CI_SLACK_CHANNEL_ID: ${{ secrets.WEEKLY_CI_SLACK_CHANNEL_ID }}
    JIRA_TICKET_SLACK_USER_GROUP_MAPPING: ${{ secrets.JIRA_TICKET_SLACK_USER_GROUP_MAPPING }}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# =============================================================================
# Jobs below (until the "REMOVE FOR PROJECT" banner) are applicable for project
# development. Everything under that banner is product-delivery only and should
# be removed when this workflow is adopted as the project CI.
# =============================================================================
jobs:
    # [project applicable] Credential scan.
    scan-credentials:
        name: "Scan for Credentials"
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run TruffleHog OSS
              uses: trufflesecurity/trufflehog@v3.90.8
              with:
                  extra_args: --log-level=2 --results=verified
    # [project applicable] Static analysis (sniffers, phpmd, phpstan, evaluator, speccy).
    validation:
        name: "Static analysis"
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        runs-on: ubuntu-latest
        # [remove for project] multi-PHP matrix is product-only; a project runs a
        # single PHP version (8.4) — drop this whole `strategy` block for the project.
        strategy:
            fail-fast: false
            matrix:
                php-version: [
                    '8.3',
                    '8.4'
                ]

        env:
            APPLICATION_ENV: ci.mysql
            APPLICATION_STORE: DE
            PROJECT: suite
            SPRYKER_CURRENT_REGION: EU
            COMPOSER_IGNORE_CHROMEDRIVER: 1

        steps:
            -   uses: actions/checkout@v4

            -   uses: ramsey/composer-install@v3
                with:
                    composer-options: "-q --ignore-platform-reqs --no-interaction --prefer-install=auto"

            -   name: Generate transfer objects
                run: vendor/bin/console transfer:generate

            -   name: Generate transfer databuilder objects
                run: vendor/bin/console transfer:databuilder:generate

            -   name: Propel install
                run: |
                    vendor/bin/console propel:schema:copy
                    vendor/bin/console propel:model:build
                    vendor/bin/console transfer:entity:generate

            -   name: Codecept build
                run: vendor/bin/codecept build -q

            -   name: Generate autocompletion files
                run: vendor/bin/console dev:ide-auto-completion:generate

            -   name: Setup search map files
                run: vendor/bin/console search:setup:source-map

            -   name: Validate propel files
                run: |
                    vendor/bin/console propel:schema:validate
                    vendor/bin/console propel:schema:validate-xml-names

            -   name: Validate transfer files
                run: vendor/bin/console transfer:validate

            -   name: Run CodeStyle checks
                run: vendor/bin/console code:sniff:style

            -   name: Run Architecture rules
                run: vendor/bin/phpmd src/ text vendor/spryker/architecture-sniffer/src/ruleset.xml --minimumpriority 2

            -   name: Run Project Architecture rules
                run: vendor/bin/phpmd src/ text phpmd.xml --minimumpriority 4

            -   name: Generate rest API documentation
                run: vendor/bin/console rest-api:generate:documentation

            -  name: Generate API
               run: |
                   echo "vendor/bin/glue api:generate" && vendor/bin/glue api:generate --quiet-meta --keep-existing
                   echo "GLUE_APPLICATION=GLUE_BACKEND vendor/bin/glue api:generate" && GLUE_APPLICATION=GLUE_BACKEND vendor/bin/glue api:generate --quiet-meta --keep-existing

            -   name: Run PHPStan
                run: vendor/bin/phpstan analyze -l 6 -c phpstan.neon src/

            # [remove for project] release-* branch flow only; projects have no release branches.
            -   name: Run Evaluator for release branches
                run: vendor/bin/evaluator evaluate --format=compact
                if: github.event.pull_request.base.ref == 'master' && startsWith(github.event.pull_request.head.ref, 'release-')

            -   name: Run Evaluator project code checks
                run: >-
                    vendor/bin/evaluator evaluate --format=compact
                    --exclude-checkers=DISCOURAGED_PACKAGES_CHECKER,MINIMUM_ALLOWED_SHOP_VERSION,NPM_CHECKER,OPEN_SOURCE_VULNERABILITIES_CHECKER,PHP_VERSION_CHECKER,SPRYKER_DEV_PACKAGES_CHECKER,SPRYKER_SECURITY_CHECKER

            -   uses: actions/setup-node@v4
                with:
                    node-version: '24'

            -   name: Install NPM packages
                run: |
                    sudo npm i --location=global --unsafe-perm speccy@0.11.0

            -   name: Speccy lint Glue specification
                run: speccy lint src/Generated/Glue/Specification/spryker_rest_api.schema.yml --rules=default --skip openapi-tags

            # [optional for project]
            -   name: Slack Notification for failed job
                uses: ./.github/actions/job-slack-notifications
                if: always()

    cypress-version-gate:
        name: "Cypress demo branch not ahead of pin"
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        runs-on: ubuntu-latest
        steps:
            # Full history so merge-base(master, HEAD) and the demo-shop lock are readable.
            -   name: Checkout demo-shop
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            # PR checkout has no local 'master'; the gate's PIN = merge-base(master, HEAD),
            # so fetch the demo-shop master branch as a local ref it can resolve.
            -   name: Fetch demo-shop master
                run: git fetch origin master:master

            # The cypress-tests checkout under tests/ is a composer dist (zip) install in CI,
            # so it has no .git. Clone the cypress repo fresh, read-only, for the gate.
            -   name: Clone spryker/cypress-tests (master + master-demo)
                run: |
                    git clone --no-checkout https://github.com/spryker/cypress-tests.git /tmp/cypress-tests
                    git -C /tmp/cypress-tests fetch origin master master-demo

            # bash + python3 are preinstalled on ubuntu-latest; the script self-execs under bash.
            # PIN = cypress hash the MERGED demo-shop version pins = merge-base(master, HEAD).
            # This is the master-line hash (NOT the PR's own lock, which would be circular).
            # Gate fails if cypress master-demo is BEHIND or AHEAD of that PIN.
            -   name: Run cypress version gate
                env:
                    DEMOSHOP_MASTER: master
                    DEMOSHOP_DEMO: HEAD
                    CYPRESS_DIR: /tmp/cypress-tests
                    CYPRESS_DEMO: origin/master-demo
                    CYPRESS_MASTER: origin/master
                    NO_FETCH: "1"
                run: bash .claude/skills/upmerge-master-to-demo/check-cypress-not-ahead.sh

            -   name: Slack Notification for failed job
                uses: ./.github/actions/job-slack-notifications
                if: always()

    # [project applicable] Frontend validation (lint, stylelint, formatter, MP unit tests).
    js-validation:
        name: "NPM validation"
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   uses: ramsey/composer-install@v3
                with:
                    composer-options: "-q --ignore-platform-reqs --no-interaction --prefer-install=auto"

            -   name: Setup Node.js
                uses: actions/setup-node@v5
                with:
                    node-version: '24'
                    cache: 'npm'

            -   name: Install NPM packages
                run: npm ci

            -   name: Style lint
                run: npm run yves:stylelint

            -   name: ES lint
                run: npm run yves:lint

            -   name: Front-end Formatter
                run: npm run formatter

            -   name: Front-end MP Lint
                run: npm run mp:lint

            -   name: Front-end MP Style lint
                run: npm run mp:stylelint

            -   name: Front-end MP Unit Tests
                run: npm run mp:test

            # [optional for project]
            -   name: Slack Notification for failed job
                uses: ./.github/actions/job-slack-notifications
                if: always()

    # Not draft-tiered: codeception always runs, so its dump must too.
    build-db:
        needs: [js-validation]
        uses: ./.github/workflows/_build-db.yml
        secrets: inherit

    codeception:
        needs: [js-validation, validation, build-db]
        uses: ./.github/workflows/_codeception.yml
        secrets: inherit

    # [project applicable] Cypress Project tests: Lint & Format
    cypress-quality-gate:
        name: "Cypress-boilerplate / Lint & Format"
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v5
                with:
                    node-version: '24'
                    cache: 'npm'
                    cache-dependency-path: tests/cypress-boilerplate/package-lock.json

            -   name: Install Cypress project dependencies
                working-directory: tests/cypress-boilerplate
                run: npm ci

            -   name: ES lint
                working-directory: tests/cypress-boilerplate
                run: npm run lint:check

            -   name: Prettier check
                working-directory: tests/cypress-boilerplate
                run: npm run prettier:check

            -   name: Slack Notification for failed job
                uses: ./.github/actions/job-slack-notifications
                if: always()

    # [project applicable] Cypress Project tests run
    cypress-e2e:
        needs: [js-validation, validation, cypress-quality-gate]
        name: "Cypress-boilerplate / E2E"
        runs-on: ubuntu-latest
        env:
            PROGRESS_TYPE: plain
            SPRYKER_PLATFORM_IMAGE: spryker/php:8.4
            TRAVIS: 1
            SPRYKER_CURRENT_REGION: EU
            DYNAMIC_STORE_MODE: true

        steps:
            -   uses: actions/checkout@v4

            -   uses: ramsey/composer-install@v3
                with:
                    composer-options: "-q --ignore-platform-reqs --optimize-autoloader --no-interaction --prefer-install=auto"

            -   name: Setup Node.js
                uses: actions/setup-node@v5
                with:
                    node-version: '24'
                    cache: 'npm'
                    cache-dependency-path: tests/cypress-boilerplate/package-lock.json

            -   name: Install Cypress project dependencies
                working-directory: tests/cypress-boilerplate
                run: npm ci

            -   name: Run docker
                run: |
                    git clone https://github.com/spryker/docker-sdk.git ./docker && git -C ./docker fetch --depth 1 origin $(cat .git.docker) && git -C ./docker checkout $(cat .git.docker)
                    docker/sdk boot .github/deploy/deploy.ci.acceptance.mariadb.cypress-boilerplate.yml
                    sudo bash -c "echo '127.0.0.1 backend-api.eu.spryker.local backend-api.us.spryker.local backend-gateway.eu.spryker.local backend-gateway.us.spryker.local backoffice.eu.spryker.local backoffice.us.spryker.local glue-backend.eu.spryker.local glue-backend.us.spryker.local glue-storefront.eu.spryker.local glue-storefront.us.spryker.local glue.eu.spryker.local glue.us.spryker.local mail.spryker.local mp.eu.spryker.local mp.us.spryker.local queue.spryker.local spryker.local swagger.spryker.local yves.eu.spryker.local yves.us.spryker.local' >> /etc/hosts"
                    docker/sdk up -t
                    docker/sdk cli composer dump-autoload -o -a --apcu -q

            -   name: Start queue worker
                run: docker/sdk console queue:worker:start --stop-when-empty

            -   name: Warm up merchant search index
                run: |
                    docker/sdk console sync:data merchant
                    docker/sdk console queue:worker:start --stop-when-empty

            -   name: Run Cypress E2E tests
                id: cypress-tests
                working-directory: tests/cypress-boilerplate
                run: npx cypress run --env environment=ci --headless --browser chrome

            -   name: Upload Cypress artifacts
                if: always() && steps.cypress-tests.outcome == 'failure'
                uses: actions/upload-artifact@v5
                with:
                    name: cypress-e2e-failed-artifacts
                    retention-days: 5
                    path: |
                        tests/cypress-boilerplate/cypress/data/screenshots/**/*
                        tests/cypress-boilerplate/cypress/data/reports/**/*

            -   name: Slack Notification for failed job
                uses: ./.github/actions/job-slack-notifications
                if: always()

    # [demo only] Isolated demo Cypress tier (cy:demo). Not part of the sharded
    # upstream cypress suite, so it stays a standalone job on master-demo.
    docker-alpine-php-84-mariadb-cypress-demo:
        needs: [js-validation, validation]
        name: "Cypress / UI Demo"
        runs-on: ubuntu-latest
        env:
            PROGRESS_TYPE: plain
            SPRYKER_PLATFORM_IMAGE: spryker/php:8.4
            TRAVIS: 1
            ROBOT_TESTS_ARTIFACTS_BUCKET_REGION: eu-west-1
            SPRYKER_CURRENT_REGION: EU
            DYNAMIC_STORE_MODE: true
        steps:
            -   uses: actions/checkout@v4

            -   uses: ramsey/composer-install@v3
                with:
                    composer-options: "-q --ignore-platform-reqs --optimize-autoloader --no-interaction --prefer-install=auto"

            -   name: Configure sysctl limits
                run: |
                    sudo sysctl -w vm.swappiness=10
                    sudo sysctl -w fs.file-max=262144
                    sudo sysctl -w vm.max_map_count=262144
                    ulimit -n 65536

            -   name: Run project in Docker
                run: |
                    git clone https://github.com/spryker/docker-sdk.git ./docker && git -C ./docker fetch --depth 1 origin $(cat .git.docker) && git -C ./docker checkout $(cat .git.docker)
                    docker/sdk boot .github/deploy/deploy.ci.acceptance.mariadb.cypress.yml
                    sudo bash -c "echo '127.0.0.1 backend-api.eu.spryker.local backend-api.us.spryker.local backend-gateway.eu.spryker.local backend-gateway.us.spryker.local backoffice.eu.spryker.local backoffice.us.spryker.local glue-backend.eu.spryker.local glue-backend.us.spryker.local glue-storefront.eu.spryker.local glue-storefront.us.spryker.local glue.eu.spryker.local glue.us.spryker.local mail.spryker.local mp.eu.spryker.local mp.us.spryker.local queue.spryker.local spryker.local swagger.spryker.local yves.eu.spryker.local yves.us.spryker.local' >> /etc/hosts"
                    docker/sdk up -t
                    docker/sdk cli composer dump-autoload -o -a --apcu -q

            -   name: Run Tests (Demo)
                id: run_demo_tests
                run: |
                    docker/sdk exec cypress-tests cp .env.dynamic-store.example .env
                    docker/sdk exec cypress-tests git log -3
                    docker/sdk exec cypress-tests npx cypress install
                    docker/sdk exec --env "ENV_REPOSITORY_ID=b2b-mp" --env "ENV_IS_SSP_ENABLED=true" cypress-tests npm run cy:demo

            -   name: Upload Screenshots (Demo)
                if: failure()
                run: |
                    AWS_DEFAULT_REGION=${{env.ROBOT_TESTS_ARTIFACTS_BUCKET_REGION}} AWS_ACCESS_KEY_ID=${{ secrets.ROBOT_TESTS_ARTIFACTS_KEY }} AWS_SECRET_ACCESS_KEY=${{ secrets.ROBOT_TESTS_ARTIFACTS_SECRET }} aws s3 cp .cypress s3://${{vars.ROBOT_TESTS_ARTIFACTS_BUCKET}}/b2b-mp/dms-on/cypress/${GITHUB_RUN_ID}/PHP8.4MariaDB-Demo/ --recursive

            -   name: Generate Cypress Test Summary
                if: always() && steps.run_demo_tests.outcome == 'failure'
                run: |
                    python3 tests/cypress-tests/generate_failure_summary.py .cypress > /tmp/cypress-summary.md 2>/dev/null || true
                    cat /tmp/cypress-summary.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

            -   name: Save PHP logs
                if: always() && steps.run_demo_tests.outcome == 'failure'
                run: |
                    mkdir -p logs
                    docker logs spryker_ci_backoffice_eu_1 > logs/backoffice_app.log 2>&1
                    docker logs spryker_ci_glue_eu_1 > logs/glue_app.log 2>&1
                    docker logs spryker_ci_yves_eu_1 > logs/yves_app.log 2>&1
                    docker logs spryker_ci_merchant_portal_eu_1 > logs/merchant_portal_app.log 2>&1
                    docker logs spryker_ci_glue_backend_eu_1 > logs/glue_backend_eu.log 2>&1 || true
                    echo "PHP logs saved. After upload, they will be available in GitHub Actions Artifacts as 'cypress-ui-demo-failed-artifacts'"

            -   name: Upload PHP logs
                if: always() && steps.run_demo_tests.outcome == 'failure'
                uses: actions/upload-artifact@v5
                with:
                    name: cypress-ui-demo-failed-artifacts
                    retention-days: 5 # save for 5 days
                    path: |
                        logs/*.log
                        .cypress/

            -   name: Slack Notification for failed job
                uses: ./.github/actions/job-slack-notifications
                if: always()


    # =========================================================================
    # REMOVE FOR PROJECT — the reusable workflows called below are
    # product-delivery / upstream maintenance suites (robot, cypress) and are
    # NOT part of the project CI. Delete these calls when adopting this
    # workflow for project work.
    # =========================================================================

    # [remove for project]
    robot-api:
        needs: [validation]
        # Draft PRs skip the E2E tier; it runs on ready_for_review.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: ./.github/workflows/_robot-api.yml
        secrets: inherit

    # [remove for project]
    robot-ui:
        needs: [js-validation, validation]
        # Draft PRs skip the E2E tier; it runs on ready_for_review.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: ./.github/workflows/_robot-ui.yml
        secrets: inherit

    # [remove for project]
    cypress:
        needs: [js-validation, validation]
        # Draft PRs skip the E2E tier; it runs on ready_for_review.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: ./.github/workflows/_cypress.yml
        secrets: inherit
