name: B2B-MP-CI-FOCUSED

on:
    workflow_dispatch:
        inputs:
            framework:
                description: "Which framework to run (and only that). cypress runs both its mp + b2b variants."
                required: true
                type: choice
                options:
                    - codeception
                    - cypress

concurrency:
    # Include the framework so concurrent focused runs on the same branch don't cancel each other
    # (a re-dispatch of the SAME framework still cancels its own in-flight run).
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.framework }}
    cancel-in-progress: true

jobs:
    # codeception restores a dump for both cells; cypress restores it for b2b-mp only (see
    # _cypress.yml).
    build-db:
        if: ${{ inputs.framework == 'codeception' || inputs.framework == 'cypress' }}
        uses: ./.github/workflows/_build-db.yml
        secrets: inherit

    build-frontend:
        if: ${{ inputs.framework == 'codeception' || inputs.framework == 'cypress' }}
        uses: ./.github/workflows/_build-frontend.yml
        secrets: inherit

    prepare-b2b:
        if: ${{ inputs.framework == 'cypress' }}
        uses: ./.github/workflows/_prepare-b2b.yml
        secrets: inherit

    build-frontend-b2b:
        if: ${{ inputs.framework == 'cypress' }}
        needs: [prepare-b2b]
        uses: ./.github/workflows/_build-frontend.yml
        secrets: inherit
        with:
            variants: '["b2b"]'

    codeception:
        if: ${{ inputs.framework == 'codeception' }}
        needs: [build-db, build-frontend]
        uses: ./.github/workflows/_codeception.yml
        secrets: inherit

    cypress:
        if: ${{ inputs.framework == 'cypress' }}
        needs: [build-db, build-frontend, build-frontend-b2b]
        uses: ./.github/workflows/_cypress.yml
        secrets: inherit
