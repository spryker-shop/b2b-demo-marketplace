name: _cypress

on:
    workflow_call:
        inputs:
            platform-image:
                description: "PHP platform image the shards boot on."
                type: string
                default: "spryker/php:8.5"
            deploy-file:
                description: "Deploy file the shards boot."
                type: string
                default: ".github/deploy/deploy.ci.acceptance.mariadb.cypress.yml"
            repository-ids:
                description: "JSON array of Cypress repository ids each core shard runs for."
                type: string
                default: '["b2b-mp", "b2b"]'
            artifact-platform:
                # Kept in step with platform-image and deploy-file; it only names the
                # S3 folder the screenshots land in.
                description: "Platform segment of the screenshot upload path."
                type: string
                default: "PHP8.5MariaDB"
            b2b-mp-shards:
                # b2b-mp has more specs than b2b and its cells were the last to finish: with 5 shards they
                # ended about 10 minutes after the b2b cells. 7 shards end them at about the same time.
                description: "Number of core Cypress shards for b2b-mp (the ssp shard comes on top)."
                type: number
                default: 7
            b2b-shards:
                description: "Number of core Cypress shards for b2b."
                type: number
                default: 5
            restore-db:
                description: "Restore the shared spryker-app-db dump for b2b-mp cells instead of importing demodata."
                type: boolean
                default: true

env:
    SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    WEEKLY_CI_SLACK_CHANNEL_ID: ${{ secrets.WEEKLY_CI_SLACK_CHANNEL_ID }}
    JIRA_TICKET_SLACK_USER_GROUP_MAPPING: ${{ secrets.JIRA_TICKET_SLACK_USER_GROUP_MAPPING }}

jobs:
    cypress-shards:
        name: "Cypress / Shards"
        runs-on: ubuntu-latest
        outputs:
            cells: ${{ steps.compute.outputs.cells }}
        steps:
            -   uses: actions/checkout@v4
                with:
                    # Nothing downstream needs the checkout token; every repo cloned or
                    # composer-installed in these jobs is public.
                    persist-credentials: false

            # Only the specs are needed here, not the whole vendor tree: fetch the exact
            # spryker/cypress-tests commit pinned in composer.lock (one commit, no history).
            -   name: Fetch cypress-tests at the locked commit
                run: |
                    SHA=$(python3 -c "import json; l = json.load(open('composer.lock')); print(next(p['source']['reference'] for p in l['packages'] + l['packages-dev'] if p['name'] == 'spryker/cypress-tests'))")
                    mkdir -p tests/cypress-tests
                    cd tests/cypress-tests
                    git init -q
                    git fetch -q --depth 1 https://github.com/spryker/cypress-tests.git "$SHA"
                    git checkout -q FETCH_HEAD
                    echo "cypress-tests at ${SHA}"

            # Warm the npm and Cypress binary caches once here, so the cell jobs (which start in
            # parallel and cannot see each other's post-job cache save) only restore them.
            -   uses: actions/setup-node@v5
                with:
                    node-version: 24
                    cache: npm
                    cache-dependency-path: tests/cypress-tests/package-lock.json

            -   name: Cache Cypress dependencies
                id: cypress_deps
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.cache/Cypress
                        tests/cypress-tests/node_modules
                    key: cypress-deps-${{ runner.os }}-${{ hashFiles('tests/cypress-tests/package-lock.json') }}

            -   name: Warm Cypress caches
                if: ${{ steps.cypress_deps.outputs.cache-hit != 'true' }}
                working-directory: tests/cypress-tests
                run: |
                    npm ci --no-audit --no-fund
                    npx cypress install

            -   id: compute
                name: Generate shard matrix
                env:
                    REPOSITORY_IDS: ${{ inputs.repository-ids }}
                    B2B_MP_SHARDS: ${{ inputs.b2b-mp-shards }}
                    B2B_SHARDS: ${{ inputs.b2b-shards }}
                # Each repository id gets its own shard count. The SSP shard is marketplace-only, so jq
                # drops it from the b2b list.
                #
                # master-demo: plain-B2B is NOT supported here, so "b2b" is filtered out of
                # the requested ids — the same rationale as the `if: false` on the standalone
                # "Cypress / UI B2B" and "Robot / API B2B" jobs in ci.yml. The demo migrated
                # its demo data to the data/import/common/** layout, so the b2b recipe
                # (b2b_full_EU.yml, substituted in by uninstall-marketplace-modules.sh)
                # imports a sales_order.csv carrying cost_center_key without importing any
                # cost centers, and data:import fails. Master's upstream expression is kept
                # intact and the demo exclusion is applied as a separate filter on $repos so
                # master's edits to this expression still merge cleanly during upmerges.
                run: |
                    MP=$(.github/workflows/scripts/generate-cypress-shards.py --shards "$B2B_MP_SHARDS")
                    B2B=$(.github/workflows/scripts/generate-cypress-shards.py --shards "$B2B_SHARDS")
                    CELLS=$(jq -cn --argjson mp "$MP" --argjson b2b "$B2B" --argjson repos "$REPOSITORY_IDS" '($repos | map(select(. != "b2b"))) as $repos | [ $repos[] as $repo
                        | (if $repo == "b2b-mp" then $mp else ($b2b | map(select(.mode != "ssp"))) end)[]
                        | . + {repository_id: $repo, label: "\($repo) \(.label)"}
                    ]')
                    echo "cells=${CELLS}" >> "$GITHUB_OUTPUT"
                    echo "Computed Cypress cells: ${CELLS}"

    cypress:
        name: "Cypress / UI ${{ matrix.cell.label }}"
        needs: cypress-shards
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                cell: ${{ fromJson(needs.cypress-shards.outputs.cells) }}
        env:
            PROGRESS_TYPE: plain
            SPRYKER_PLATFORM_IMAGE: ${{ inputs.platform-image }}
            TRAVIS: 1
            ROBOT_TESTS_ARTIFACTS_BUCKET_REGION: eu-west-1
            SPRYKER_CURRENT_REGION: EU
            DYNAMIC_STORE_MODE: true
            DEPLOY_FILE: ${{ inputs.deploy-file }}
            ARTIFACT_PLATFORM: ${{ inputs.artifact-platform }}
            RESTORE_DB: ${{ inputs.restore-db && matrix.cell.repository_id == 'b2b-mp' }}
        steps:
            -   uses: actions/checkout@v4
                with:
                    persist-credentials: false

            # b2b: the marketplace uninstall from the Prepare B2B job (_prepare-b2b.yml), applied before
            # `composer install` (it changes composer.json and composer.lock) and before the frontend
            # restore (part of the key).
            -   name: Apply b2b changes
                if: ${{ matrix.cell.repository_id == 'b2b' }}
                uses: ./.github/actions/apply-b2b-changes

            -   uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
                with:
                    composer-options: "-q --ignore-platform-reqs --optimize-autoloader --no-interaction --prefer-install=auto"

            # Frontend assets come from _build-frontend.yml; the pipeline no longer builds them in the container.
            -   name: Restore frontend assets
                id: fe_cache
                uses: ./.github/actions/restore-frontend-assets
                with:
                    variant: ${{ matrix.cell.repository_id }}

            # Self-healing fallback: build-frontend populates the cache first, so a miss means eviction or
            # key drift. Warn so it is visible, then build here rather than fail.
            -   name: Warn on frontend assets cache miss
                if: ${{ steps.fe_cache.outputs.cache-hit != 'true' }}
                run: echo "::warning::frontend-assets cache miss in a consumer job; build-frontend should have populated this key. Building inline."

            -   name: Build frontend assets
                if: ${{ steps.fe_cache.outputs.cache-hit != 'true' }}
                uses: ./.github/actions/build-frontend-assets
                with:
                    variant: ${{ matrix.cell.repository_id }}
                    cache-key: ${{ steps.fe_cache.outputs.key }}

            -   name: Configure sysctl limits
                run: |
                    sudo sysctl -w vm.swappiness=10
                    sudo sysctl -w fs.file-max=262144
                    sudo sysctl -w vm.max_map_count=262144
                    ulimit -n 65536

            # Must land before the boot so the dump is part of the baked image.
            -   uses: actions/download-artifact@v6
                if: ${{ inputs.restore-db && matrix.cell.repository_id == 'b2b-mp' }}
                with:
                    name: spryker-app-db

            -   name: Run project in Docker
                # b2b-mp/MariaDB restores the shared dump (see _build-db.yml) — the only cell
                # that matches its schema/engine: b2b uninstalls marketplace, and a non-MariaDB
                # caller sets restore-db false. Accepts the previously-documented DMS-spec risk
                # (CC-39284) for the time saved on the rest of the shard.
                run: |
                    git clone https://github.com/spryker/docker-sdk.git ./docker && git -C ./docker fetch --depth 1 origin $(cat .git.docker) && git -C ./docker checkout $(cat .git.docker)
                    docker/sdk boot "$DEPLOY_FILE"
                    sudo bash -c "echo '127.0.0.1 backend-api.eu.spryker.local backend-api.us.spryker.local backend-gateway.eu.spryker.local backend-gateway.us.spryker.local backoffice.eu.spryker.local backoffice.us.spryker.local glue-backend.eu.spryker.local glue-backend.us.spryker.local glue-storefront.eu.spryker.local glue-storefront.us.spryker.local glue.eu.spryker.local glue.us.spryker.local mail.spryker.local mp.eu.spryker.local mp.us.spryker.local queue.spryker.local spryker.local swagger.spryker.local yves.eu.spryker.local yves.us.spryker.local' >> /etc/hosts"
                    if [ "$RESTORE_DB" = "true" ]; then
                        SPRYKER_PIPELINE=ci.restore-db.stage2 docker/sdk up -t
                    else
                        docker/sdk up -t
                    fi
                    docker/sdk cli composer dump-autoload -o -a --apcu -q

            -   name: Validate sync completeness
                if: ${{ inputs.restore-db && matrix.cell.repository_id == 'b2b-mp' }}
                uses: ./.github/actions/validate-sync-completeness

            -   uses: actions/setup-node@v5
                with:
                    node-version: 24

            -   name: Restore Cypress dependencies
                id: cypress_deps
                uses: actions/cache/restore@v4
                with:
                    path: |
                        ~/.cache/Cypress
                        tests/cypress-tests/node_modules
                    key: cypress-deps-${{ runner.os }}-${{ hashFiles('tests/cypress-tests/package-lock.json') }}

            -   name: Install Cypress
                # node_modules and the binary normally come from the cache warmed in the shards job.
                if: ${{ steps.cypress_deps.outputs.cache-hit != 'true' }}
                working-directory: tests/cypress-tests
                run: |
                    npm ci --no-audit --no-fund
                    npx cypress install

            -   name: Configure Cypress
                run: |
                    cp tests/cypress-tests/.env.dynamic-store.example tests/cypress-tests/.env
                    # Map every Spryker hostname (deploy file + cypress env) to the docker-sdk frontend published on the runner host.
                    HOSTS=$(grep -hoE '[A-Za-z0-9.-]+\.spryker\.local' "$DEPLOY_FILE" tests/cypress-tests/.env | sort -u | tr '\n' ' ')
                    echo "127.0.0.1 ${HOSTS}" | sudo tee -a /etc/hosts
                    # Keep artifacts where the workflow steps expect them (repo-root .cypress/).
                    for d in screenshots videos downloads logs; do
                        mkdir -p ".cypress/$d"
                        rm -rf "tests/cypress-tests/cypress/$d"
                        ln -s "$GITHUB_WORKSPACE/.cypress/$d" "tests/cypress-tests/cypress/$d"
                    done

            -   name: Run Tests
                id: run_tests
                working-directory: tests/cypress-tests
                env:
                    ENV_REPOSITORY_ID: ${{ matrix.cell.repository_id }}
                    ENV_IS_SSP_ENABLED: true
                    CELL_MODE: ${{ matrix.cell.mode }}
                    CELL_SPECS: ${{ matrix.cell.specs }}
                run: |
                    if [ "$CELL_MODE" = "ssp" ]; then
                        npm run cy:ci:ssp
                    else
                        npx cypress run --headless --browser chrome --config retries=2 --spec "$CELL_SPECS"
                    fi

            -   name: Upload Screenshots
                # Scoped to a test failure: on a failed boot `.cypress` does not exist yet, and
                # the upload would add a second red step pointing away from the real cause.
                if: failure() && steps.run_tests.outcome == 'failure'
                run: |
                    AWS_DEFAULT_REGION=${{env.ROBOT_TESTS_ARTIFACTS_BUCKET_REGION}} AWS_ACCESS_KEY_ID=${{ secrets.ROBOT_TESTS_ARTIFACTS_KEY }} AWS_SECRET_ACCESS_KEY=${{ secrets.ROBOT_TESTS_ARTIFACTS_SECRET }} aws s3 cp .cypress s3://${{vars.ROBOT_TESTS_ARTIFACTS_BUCKET}}/${{ matrix.cell.repository_id }}/dms-on/cypress/${GITHUB_RUN_ID}/${ARTIFACT_PLATFORM}/shard-${{ matrix.cell.shard }}/ --recursive

            -   name: Generate Cypress Test Summary
                if: always() && steps.run_tests.outcome == 'failure'
                run: |
                    python3 tests/cypress-tests/generate_failure_summary.py .cypress > /tmp/cypress-summary.md 2>/dev/null || true
                    cat /tmp/cypress-summary.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

            -   name: Save PHP logs
                if: always() && steps.run_tests.outcome == 'failure'
                run: |
                    mkdir -p logs
                    docker logs spryker_ci_backoffice_eu_1 > logs/backoffice_app.log 2>&1
                    docker logs spryker_ci_glue_eu_1 > logs/glue_app.log 2>&1
                    docker logs spryker_ci_yves_eu_1 > logs/yves_app.log 2>&1
                    docker logs spryker_ci_merchant_portal_eu_1 > logs/merchant_portal_app.log 2>&1
                    docker logs spryker_ci_glue_backend_eu_1 > logs/glue_backend_eu.log 2>&1 || true
                    echo "PHP logs saved. After upload, they will be available in GitHub Actions Artifacts."

            -   name: Upload PHP logs
                if: always() && steps.run_tests.outcome == 'failure'
                uses: actions/upload-artifact@v6
                with:
                    name: cypress-ui-${{ matrix.cell.repository_id }}-${{ matrix.cell.shard }}-failed-artifacts
                    retention-days: 5 # save for 5 days
                    include-hidden-files: true
                    path: |
                        logs/*.log
                        .cypress/

            -   name: Slack Notification for failed job
                uses: ./.github/actions/job-slack-notifications
                if: always()
