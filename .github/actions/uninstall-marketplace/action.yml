name: "Uninstall marketplace"
description: >
    Turn the checkout into the B2B (non-marketplace) shop: remove the marketplace npm scripts and the
    marketplace composer packages. Needs vendor/ (composer install). Run it before
    restore-frontend-assets and before `docker/sdk boot`.

runs:
    using: composite
    steps:
        -   name: Uninstall marketplace modules and frontend
            shell: bash
            run: |
                chmod +x uninstall-marketplace-modules.sh uninstall-frontend-marketplace.sh
                ./uninstall-frontend-marketplace.sh
                ./uninstall-marketplace-modules.sh
