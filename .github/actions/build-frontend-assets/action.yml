name: "Build frontend assets"
description: >
    Build the Yves, Back Office and (b2b-mp only) Merchant Portal assets on the runner (with the frontend:*:build
    console commands) and save them
    under the key restore-frontend-assets resolved. Used by build-frontend (the producer) and by the
    consumer jobs as a fallback when their restore misses, so the build lives in one place.
    Needs vendor/ (composer install) and, for the b2b variant, the apply-b2b-changes action first.

inputs:
    variant:
        description: "Frontend variant: b2b-mp or b2b."
        required: true
    cache-key:
        description: "Cache key to save under (the key output of restore-frontend-assets)."
        required: true

runs:
    using: composite
    steps:
        -   uses: actions/setup-node@v5
            with:
                node-version: 24
                cache: npm

        -   name: Install NPM packages
            shell: bash
            run: npm ci --no-audit --no-fund

        # The console commands the pipelines ran in the container before. Each one first writes
        # data/cache/<App>/frontend/build-config.json (project namespaces, themes) and then runs the npm
        # build; a plain `npm run yves|zed|mp:build` would build only the core layout. The console runs
        # on the runner's PHP with the static-analysis environment and needs the generated transfers.
        -   name: Generate transfer objects
            shell: bash
            env:
                APPLICATION_ENV: ci.mysql
                APPLICATION_STORE: DE
                SPRYKER_CURRENT_REGION: EU
            run: vendor/bin/console transfer:generate

        -   name: Yves
            shell: bash
            env:
                APPLICATION_ENV: ci.mysql
                APPLICATION_STORE: DE
                SPRYKER_CURRENT_REGION: EU
            run: vendor/bin/console frontend:yves:build

        -   name: Back Office
            shell: bash
            env:
                APPLICATION_ENV: ci.mysql
                APPLICATION_STORE: DE
                SPRYKER_CURRENT_REGION: EU
            run: vendor/bin/console frontend:zed:build

        -   name: Merchant Portal
            if: ${{ inputs.variant == 'b2b-mp' }}
            shell: bash
            env:
                APPLICATION_ENV: ci.mysql
                APPLICATION_STORE: DE
                SPRYKER_CURRENT_REGION: EU
            run: vendor/bin/console frontend:mp:build

        -   name: Save frontend assets
            uses: actions/cache/save@v4
            with:
                path: |
                    public/Yves/assets
                    public/Zed/assets
                    public/Backoffice/assets
                    public/MerchantPortal/assets
                key: ${{ inputs.cache-key }}
