name: "Restore frontend assets"
description: >
    Restore the content-addressed frontend-assets cache of one variant (b2b-mp, or b2b after the
    marketplace uninstall). The key is a hash of every input of the compiled assets, so a hit can only
    occur when the build would produce the same output. There is no restore-keys fallback on purpose:
    a partial match would restore stale assets. This action is the single source of the key and the
    paths: build-frontend (producer) and the consumer jobs call it, so they cannot drift.
    For the b2b variant, run the apply-b2b-changes action first: it changes package.json and
    composer.lock, which are part of the key.

inputs:
    variant:
        description: "Frontend variant: b2b-mp or b2b."
        required: true

outputs:
    cache-hit:
        description: "'true' when the assets were restored (the build can be skipped)."
        value: ${{ steps.restore.outputs.cache-hit }}
    key:
        description: "The resolved cache key; reuse it for the matching cache save."
        value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
    using: composite
    steps:
        -   id: restore
            uses: actions/cache/restore@v4
            with:
                path: |
                    public/Yves/assets
                    public/Zed/assets
                    public/Backoffice/assets
                    public/MerchantPortal/assets
                # Inputs of `npm run yves|zed|mp:build`. composer.lock covers the vendor frontend modules
                # the build reads; the src globs are limited to frontend file types, so a PHP-only change
                # does not invalidate the assets. The root angular.json and tsconfig.json are generated by
                # postinstall and are not there before `npm ci`, so they are not hashed.
                key: fe-assets-${{ inputs.variant }}-${{ hashFiles('package-lock.json', 'package.json', 'composer.lock', 'frontend/**', 'src/**/Theme/**', 'src/**/*.scss', 'src/**/*.css', 'src/**/*.ts', 'src/**/*.js', 'src/**/*.mts', 'src/**/*.mjs', 'src/**/package.json', 'src/**/tsconfig*.json', 'src/**/angular.json', '.browserslistrc') }}
