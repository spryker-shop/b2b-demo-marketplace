version: '0.1'

# CI deploy file for the functional Codeception job.
#
# Retargeted from the demoshop's region EU (hosts *.eu.spryker.local) to this project's region
# EE. Region EU does not exist here - src/SprykerConfig/CodeBucketConfig.php returns
# [EE, PL, UA] - so the shipped EU version would fail the install. The former
# SPRYKER_YVES_HOST_US entry is dropped for the same reason.

namespace: spryker_ci
tag: '1.0'

environment: docker.ci
pipeline: docker.ci.api.full
image:
    tag: spryker/php:8.4
    php:
        enabled-extensions:
            - otel
            - amqp
    environment:
        SPRYKER_DYNAMIC_STORE_MODE: true
        SPRYKER_YVES_HOST_EE: yves.ee.plmb.local
    node:
        version: 24
        npm: 10

composer:
    mode: '--quiet -o -a'
    autoload: '-a -a'

regions:
    EE:
        services:
            database:
                database: ee-docker
                username: spryker
                password: secret

            broker:
                namespace: ee-docker
                key_value_store:
                    namespace: 1
                search:
                    namespace: ee_search

groups:
    EE:
        region: EE
        applications:
            yves:
                application: yves
                endpoints:
                    yves.ee.plmb.local:
                        region: EE
                        services:
                            session:
                                namespace: 1
            glue:
                application: glue
                endpoints:
                    glue.ee.plmb.local:
                        region: EE
            boffice:
                application: backoffice
                endpoints:
                    backoffice.ee.plmb.local:
                        region: EE
                        primal: true
                        services:
                            session:
                                namespace: 3
            backgw:
                application: backend-gateway
                endpoints:
                    backend-gateway.ee.plmb.local:
                        region: EE
                        primal: true
            backapi:
                application: zed
                endpoints:
                    backend-api.ee.plmb.local:
                        region: EE
                        entry-point: BackendApi
            gluestorefront:
                application: glue-storefront
                endpoints:
                    glue-storefront.ee.plmb.local:
                        region: EE
            gluebackend:
                application: glue-backend
                endpoints:
                    glue-backend.ee.plmb.local:
                        region: EE

services:
    database:
        engine: mysql
        version: mariadb-11.8
        root:
            username: 'root'
            password: 'secret'
    broker:
        engine: rabbitmq
        version: '4.1'
        api:
            username: 'spryker'
            password: 'secret'
    session:
        engine: valkey
    key_value_store:
        engine: valkey
    search:
        engine: opensearch
        version: '1.3'

docker:
    ssl:
        enabled: false

    debug:
        enabled: false
        xdebug:
            enabled: false

    testing:
        region: EE

    mount:
        baked:
