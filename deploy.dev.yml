version: '0.1'

namespace: pellumbra_ee_dev
tag: 'dev'

environment: docker.dev
image:
    tag: spryker/php:8.4
    php:
        enabled-extensions:
            - otel
            - amqp
        ini:
        'upload_max_filesize': '100M'
        'post_max_size': '100M'
    environment:
        SPRYKER_WATER_TREATMENT_CONFIGURATOR_HOST: water-treatment-configurator.plmb.local
        SPRYKER_WATER_TREATMENT_CONFIGURATOR_PORT: 80
        SPRYKER_DYNAMIC_STORE_MODE: true
        SPRYKER_YVES_HOST_EE: yves.ee.plmb.local
    node:
        version: 24
        npm: 10

composer:
    mode: ''
    autoload: ''

assets:
    mode: development

regions:
    EE:
        services:
            mail:
                sender:
                    name: Pellumbra No-Reply
                    email: no-reply@plmb.local
            database:
                database: ee-docker
                username: spryker
                password: secret

            broker:
                namespace: ee-docker
            key_value_store:
                namespace: 1
            search:
                namespace: ee_search

groups:
    EE:
        region: EE
        applications:
            mportal_ee: # custom name to differentiate between two applications, incorrect for the cloud usage
                application: merchant-portal
                endpoints:
                    mp.ee.plmb.local:
                        region: EE
                        entry-point: MerchantPortal
                        primal: true
                        services:
                            session:
                                namespace: 1
            yves_ee: # custom name to differentiate between two applications, incorrect for the cloud usage
                application: yves
                endpoints:
                    water-treatment-configurator.plmb.local:
                        entry-point: WaterTreatmentConfigurator
                    yves.ee.plmb.local:
                        region: EE
                        services:
                            session:
                                namespace: 2
                http:
                    max-request-body-size: 100M
            glue_ee: # custom name to differentiate between two applications, incorrect for the cloud usage
                application: glue
                endpoints:
                    glue.ee.plmb.local:
                        region: EE
            gluebackend_ee: # custom name to differentiate between two applications, incorrect for the cloud usage
                application: glue-backend
                endpoints:
                    glue-backend.ee.plmb.local:
                        region: EE
            boffice_ee: # custom name to differentiate between two applications, incorrect for the cloud usage
                application: backoffice
                endpoints:
                    backoffice.ee.plmb.local:
                        region: EE
                        primal: true
                        services:
                            session:
                                namespace: 3
                http:
                    max-request-body-size: 100M
            backgw_ee: # custom name to differentiate between two applications, incorrect for the cloud usage
                application: backend-gateway
                endpoints:
                    backend-gateway.ee.plmb.local:
                        region: EE
                        primal: true
            storybook_ee:
                application: static
                endpoints:
                    storybook.plmb.local:
                        entry-point: Storybook/assets
                        region: EE
services:
    database:
        engine: mysql
        version: mariadb-11.8
        root:
            username: 'root'
            password: 'secret'
        endpoints:
            localhost:3306:
                protocol: tcp
    broker:
        engine: rabbitmq
        version: '4.1'
        api:
            username: 'spryker'
            password: 'secret'
        endpoints:
            queue.plmb.local:
            localhost:5672:
                protocol: tcp
    session:
        engine: valkey
    key_value_store:
        engine: valkey
        endpoints:
            localhost:16379:
                protocol: tcp
    search:
        engine: opensearch
        version: '1.3'
        endpoints:
            localhost:9200:
                protocol: tcp
    scheduler:
        engine: jenkins
        version: '2.516.3'
        csrf-protection-enabled: true
        endpoints:
            scheduler.plmb.local:
    mail_catcher:
        engine: mailpit
        endpoints:
            mail.plmb.local:
    swagger:
        engine: swagger-ui
        endpoints:
            swagger.plmb.local:
    redis-gui:
        engine: redis-commander
        endpoints:
            redis-commander.plmb.local:
    dashboard:
        engine: dashboard
        endpoints:
            plmb.local:
    webdriver:
        engine: chromedriver

docker:
    ssl:
        enabled: false
        redirect: true

    testing:
        region: EE

    debug:
        enabled: true
        xdebug:
            enabled: true

    mount:
        native:
            platforms:
                - linux

        docker-sync:
            platforms:
                - windows

        mutagen:
            platforms:
                - macos
